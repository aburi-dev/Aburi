name: Benchmark

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      only:
        description: Comma-separated repo ids from repos.json; empty means every repo
        required: false
        default: ""
      runs:
        description: Measured scan runs per repo; the report quotes the median
        required: false
        default: "3"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  measure:
    name: measure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The runner changes between runs, so the commit the previous run measured is rebuilt here
      # and measured beside this one: only that comparison separates the code from the hardware.
      - name: Build the commit the previous run measured
        id: baseline
        # Without the baseline the sweep still runs, comparing across runners only.
        continue-on-error: true
        run: |
          previous="$(ls benchmarks/public-repos/results/????-??-??.json 2>/dev/null | sort | tail -1)"
          if [ -z "$previous" ]; then
            echo "No previous results file; the report compares against nothing." >&2
            exit 0
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          commit="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).commit ?? ""' "$previous")"
          if [ -z "$commit" ]; then
            echo "$previous records no commit; the report compares across runners only." >&2
            exit 0
          fi
          baseline="$RUNNER_TEMP/aburi-baseline"
          git fetch --no-tags --depth=1 origin "$commit"
          git worktree add --detach "$baseline" "$commit"
          cd "$baseline"
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter='./packages/*'
          echo "dir=$baseline" >> "$GITHUB_OUTPUT"

      - name: Run the benchmark
        env:
          ONLY: ${{ inputs.only }}
          RUNS: ${{ inputs.runs || '3' }}
          PREVIOUS: ${{ steps.baseline.outputs.previous }}
          BASELINE: ${{ steps.baseline.outputs.dir }}
        run: |
          args=(--work-dir "$RUNNER_TEMP/aburi-bench-work" --runs "$RUNS")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ -n "$PREVIOUS" ]; then args+=(--previous "$PREVIOUS"); fi
          if [ -n "$BASELINE" ]; then args+=(--baseline "$BASELINE"); fi
          node benchmarks/public-repos/run.mjs "${args[@]}"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmark-results
          path: benchmarks/public-repos/results/
          if-no-files-found: ignore

      - name: Open a pull request with the results
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          report="$(git status --porcelain benchmarks/public-repos/results | awk '$NF ~ /[0-9]\.md$/ { print $NF }' | sort | tail -1)"
          if [ -z "$report" ]; then
            echo "The run produced no new report." >&2
            exit 1
          fi
          stamp="$(basename "$report" .md)"
          branch="benchmark/$stamp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add benchmarks/public-repos/results
          git commit -m "Record the $stamp public-repository benchmark"
          git push --force origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $branch is already open; the push updated it." >&2
            exit 0
          fi
          {
            echo "Measured by the \`Benchmark\` workflow on \`$HEAD_SHA\`."
            echo
            echo "What moved is not written up yet. The same-runner columns measure the previous run's commit on this runner, so they show what the code moved; the across-runner columns also move with the runner."
            echo
            cat "$report"
          } > "$RUNNER_TEMP/benchmark-pr-body.md"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Record the $stamp public-repository benchmark" \
            --body-file "$RUNNER_TEMP/benchmark-pr-body.md"
