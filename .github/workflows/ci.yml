name: CI

on:
  push:
    branches: [main]
  # Every base branch, so a pull request stacked on another one is tested before its base merges.
  pull_request:

# Pushes to main always finish: the release run needs a completed CI run, not a cancelled one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, ${{ matrix.replica }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        replica: [1]
        include:
          - { os: windows-latest, replica: 1 }
          - { os: windows-latest, replica: 2 }
          - { os: windows-latest, replica: 3 }
          - { os: windows-latest, replica: 4 }
          - { os: windows-latest, replica: 5 }
          - { os: windows-2022, replica: 1 }
          - { os: windows-2022, replica: 2 }
          - { os: windows-2022, replica: 3 }
          - { os: windows-2022, replica: 4 }
          - { os: windows-2022, replica: 5 }
    env:
      # Two tasks at a time: Windows runners now and then fail to start a process (0xC0000142), which is
      # usually blamed on many starting at once. All logs, streamed, so a dying run shows what was running.
      TURBO_ARGS: ${{ startsWith(matrix.os, 'windows') && '--concurrency=2 --output-logs=full --log-order=stream' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Windows machine
        if: runner.os == 'Windows'
        run: |
          Get-CimInstance Win32_ComputerSystem | Format-List NumberOfLogicalProcessors, TotalPhysicalMemory
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, TotalVisibleMemorySize, FreePhysicalMemory, TotalVirtualMemorySize, FreeVirtualMemory
          Get-CimInstance Win32_PageFileUsage | Format-List Name, AllocatedBaseSize, CurrentUsage, PeakUsage
          "processes: $((Get-Process).Count)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: No citations of design docs, spec ids or issues
        run: pnpm hygiene

      - name: Typecheck
        run: pnpm typecheck ${{ env.TURBO_ARGS }}

      - name: Build
        run: pnpm build ${{ env.TURBO_ARGS }}

      - name: Test
        run: pnpm test ${{ env.TURBO_ARGS }}

      # A process that fails to initialise (0xC0000142) prints nothing, and from then on no new process on
      # the runner starts. If this step can start, Windows's own records name the resource that ran out.
      - name: Windows resources after a failure
        if: failure() && runner.os == 'Windows'
        run: |
          Get-CimInstance Win32_OperatingSystem | Format-List TotalVisibleMemorySize, FreePhysicalMemory, TotalVirtualMemorySize, FreeVirtualMemory
          Get-CimInstance Win32_PageFileUsage | Format-List Name, AllocatedBaseSize, CurrentUsage, PeakUsage
          Get-WinEvent -MaxEvents 50 -ErrorAction SilentlyContinue -FilterHashtable @{ LogName = 'System'; Level = 1, 2, 3; StartTime = (Get-Date).AddHours(-1) } | Format-List TimeCreated, ProviderName, Id, Message
          Get-Process | Group-Object ProcessName | Sort-Object Count -Descending | Select-Object -First 15 Count, Name | Format-Table -AutoSize
