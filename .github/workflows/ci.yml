name: CI

on:
  push:
    branches: [main]
  # Every base branch, so a pull request stacked on another one is tested before its base merges.
  pull_request:

# Pushes to main always finish: the release run needs a completed CI run, not a cancelled one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Two tasks at a time: Windows runners now and then fail to start a process (0xC0000142), which is
      # usually blamed on many starting at once. All logs, streamed, so a dying run shows what was running.
      TURBO_ARGS: ${{ startsWith(matrix.os, 'windows') && '--concurrency=2 --output-logs=full --log-order=stream' || '' }}
      # On Windows a task runs under a sampler of the runner, which reads TURBO_ARGS, because a run that dies
      # of 0xC0000142 can start nothing afterwards to look at what the runner held.
      RUN_TASK: ${{ startsWith(matrix.os, 'windows') && './.github/scripts/run-sampled.ps1' || 'pnpm' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: No citations of design docs, spec ids or issues
        run: pnpm hygiene

      - name: Typecheck
        run: ${{ env.RUN_TASK }} typecheck

      - name: Build
        run: ${{ env.RUN_TASK }} build

      - name: Test
        run: ${{ env.RUN_TASK }} test
