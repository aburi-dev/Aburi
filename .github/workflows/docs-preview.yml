name: Docs preview

on:
  pull_request:

# Per pull request: a newer push supersedes the upload still building, and the alias serves whichever
# upload finished last.
concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upload:
    name: Upload
    # Fork and Dependabot runs get no repository secrets, so there is no token to upload with.
    if: >-
      github.repository == 'aburi-dev/Aburi'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      alias-url: ${{ steps.upload.outputs.alias-url }}
      version-url: ${{ steps.upload.outputs.version-url }}
    steps:
      # Full history: VitePress' lastUpdated reads each page's date from the git log.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm --filter @aburi/docs build

      # A version, not a deployment: aburi.dev keeps serving the release until docs.yml deploys the next one.
      - name: Upload a preview version
        id: upload
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4 versions upload --preview-alias "$PREVIEW_ALIAS" --message "Preview of $HEAD_SHA"
          entry=$(jq -c 'select(.type == "version-upload")' "$WRANGLER_OUTPUT_FILE_PATH")
          alias_url=$(jq -r '.preview_alias_url // empty' <<< "$entry")
          version_url=$(jq -r '.preview_url // empty' <<< "$entry")
          if [ -z "$alias_url" ] || [ -z "$version_url" ]; then
            echo "::error::Wrangler uploaded the version but reported no preview URL. preview_urls in docs/wrangler.jsonc has to stay true for previews to be served." >&2
            exit 1
          fi
          {
            echo "alias-url=$alias_url"
            echo "version-url=$version_url"
          } >> "$GITHUB_OUTPUT"
          echo "Docs preview: $alias_url (this commit: $version_url)" >> "$GITHUB_STEP_SUMMARY"

  comment:
    name: Link the preview
    needs: upload
    # A failed build is reported too, or the comment would keep advertising the previous push as current.
    # A cancelled one was superseded by a newer push, whose own run reports.
    if: always() && (needs.upload.result == 'success' || needs.upload.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Upsert the preview comment
        uses: actions/github-script@v9.0.0
        env:
          UPLOAD_RESULT: ${{ needs.upload.result }}
          ALIAS_URL: ${{ needs.upload.outputs.alias-url }}
          VERSION_URL: ${{ needs.upload.outputs.version-url }}
        with:
          script: |
            const marker = '<!-- aburi:docs-preview -->'
            const { owner, repo } = context.repo
            const pr = context.payload.pull_request
            const { UPLOAD_RESULT, ALIAS_URL, VERSION_URL } = process.env
            const repoUrl = `${context.serverUrl}/${owner}/${repo}`
            const link = (url, text = url) => `<a href="${url}">${text}</a>`
            const row = (label, value) => `<tr><td><strong>${label}</strong></td><td>${value}</td></tr>`
            const commit = link(`${repoUrl}/commit/${pr.head.sha}`, `<code>${pr.head.sha.slice(0, 7)}</code>`)

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            })
            const existing = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker),
            )
            // The alias keeps serving the last successful upload, so a failed push still links it.
            const previousAlias = existing?.body.match(/Preview URL:<\/strong><\/td><td><a href="([^"]+)"/)?.[1]

            const rows =
              UPLOAD_RESULT === 'success'
                ? [
                    row('Latest commit:', commit),
                    row('Status:', '✅&nbsp; Preview ready'),
                    row('Preview URL:', link(ALIAS_URL)),
                    row('This commit:', link(VERSION_URL)),
                  ]
                : [
                    row('Latest commit:', commit),
                    row('Status:', '❌&nbsp; Build failed'),
                    ...(previousAlias
                      ? [row('Preview URL:', `${link(previousAlias)} (still the last successful push)`)]
                      : []),
                  ]
            const body = [
              marker,
              '## Docs preview on <img alt="" src="https://workers.cloudflare.com/logo.svg" width="16">&nbsp;Cloudflare Workers',
              '',
              `<table>${rows.join('')}</table>`,
              '',
              `${link(`${repoUrl}/actions/runs/${context.runId}`, 'View logs')} · built from this pull request merged into <code>${pr.base.ref}</code>`,
            ].join('\n')

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body })
            }
